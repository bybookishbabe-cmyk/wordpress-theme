<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-label="book bouquet wrap with watercolor flowers">
  <defs>
    <linearGradient id="paper" x1="154" x2="566" y1="350" y2="704" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f1d8c1"/>
      <stop offset=".48" stop-color="#d7ad88"/>
      <stop offset="1" stop-color="#b77f5d"/>
    </linearGradient>
    <linearGradient id="paperShade" x1="168" x2="556" y1="430" y2="658" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff1df" stop-opacity=".68"/>
      <stop offset=".5" stop-color="#c68f70" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7b4633" stop-opacity=".36"/>
    </linearGradient>
    <radialGradient id="pinkPetal" cx=".35" cy=".35" r=".74">
      <stop offset="0" stop-color="#ffe0ea"/>
      <stop offset=".5" stop-color="#e899b4"/>
      <stop offset="1" stop-color="#b75577"/>
    </radialGradient>
    <radialGradient id="lavPetal" cx=".38" cy=".28" r=".82">
